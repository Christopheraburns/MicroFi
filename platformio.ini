; MicroFi - PlatformIO build configuration
;
; Two environments are defined:
;   esp32s3    -- primary target. Lonely Binary ESP32-S3 N16R8 (16 MB flash,
;                 512 KB SRAM + 8 MB OPI PSRAM). This is what the firmware
;                 is developed and tested against.
;   esp32-c3   -- ESP32-C3 DevKitM-1; useful for confirming the binary
;                 still fits on a tighter target (smaller flash, no PSRAM).
;
; To build / flash / monitor on the primary target:
;   pio run                          (uses esp32s3 default)
;   pio run -t upload -t monitor     (build + flash + monitor on esp32s3)

[platformio]
default_envs = esp32s3

; Vendored cJSON lives under `vendor/cjson/` and is compiled from `src/CMakeLists.txt`
; (avoids relying on PIO + slim ESP-IDF picking up extra `components/` trees).
[env]
framework = espidf
monitor_speed = 115200
extra_scripts = pre:cxx_cpp_std.py, post:cxx_fixup.py
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp32s3]
platform = espressif32
board = lonely-binary-esp32s3-n16r8
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
monitor_filters = log2file
