; MicroFi - PlatformIO build configuration
;
; Environments:
;   esp32s3      PRIMARY. Lonely Binary ESP32-S3 N16R8 (16 MB flash, 8 MB PSRAM).
;                Full feature set: LittleFS persistence, OTA slots.
;
;   esp32s3-4mb  ESP32-S3 DevKitC-1 or any generic 4 MB S3 module.
;                Reduced LittleFS partition (~2.4 MB); no OTA.
;
;   esp32-c3     ESP32-C3 DevKitM-1 (4 MB flash, no PSRAM).
;                No LittleFS -- storage_init() returns NotFound and the agent
;                runs in volatile-only mode (flow defs lost on reboot).
;
; Common usage:
;   pio run                               build esp32s3 (default)
;   pio run -t upload -t monitor          flash + monitor on esp32s3
;   pio run -e esp32-c3 -t upload         flash C3
;   pio run -e esp32s3-4mb -t upload      flash generic 4 MB S3

[platformio]
default_envs = esp32s3

; ---- Shared settings (inherited by every environment) ------------------------
[env]
framework = espidf
monitor_speed = 115200
extra_scripts = pre:check_sdkconfig_local.py, pre:cxx_cpp_std.py, post:cxx_fixup.py
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults\;sdkconfig.defaults.local
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter

; ---- ESP32-S3 family (LittleFS enabled) --------------------------------------

[env:esp32s3]
; Lonely Binary ESP32-S3 N16R8 -- 16 MB flash, 8 MB OPI PSRAM.
; Primary development and test target.
platform = espressif32
board = lonely-binary-esp32s3-n16r8
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
monitor_filters = log2file

[env:esp32s3-4mb]
; Generic ESP32-S3 module with 4 MB flash (e.g. ESP32-S3-DevKitC-1).
; Uses a reduced partition table: smaller app slot, ~2.4 MB LittleFS.
; No OTA slot -- single-app layout to preserve space.
platform = espressif32
board = esp32s3box
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
monitor_filters = log2file

[env:esp32s3-2mb]
; Real 2 MB S3 modules (e.g. XIAO ESP32-S3 Sense -- esptool reports
; "Expected 4MB, found 2MB!" if you try esp32s3-4mb on one of these).
; Same single-app/no-OTA shape as esp32s3-4mb, re-sized so littlefs never
; extends past the physical 2 MB chip. See partitions_2mb.csv for the math.
platform = espressif32
board = esp32s3box
board_build.partitions = partitions_2mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 2MB
monitor_filters = log2file

; ---- Constrained targets (no LittleFS, volatile-only mode) -------------------

[env:esp32-c3]
; ESP32-C3 DevKitM-1 -- 4 MB flash, no PSRAM.
; No partition table override: default PlatformIO layout has no LittleFS
; entry, so storage_init() returns NotFound and the agent runs volatile-only.
; FlowFiles and flow definitions are not persisted across reboots.
platform = espressif32
board = esp32-c3-devkitm-1
